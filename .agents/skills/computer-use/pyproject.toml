[project]
name = "prime-agent-skill-computer-use"
version = "0.1.0"
description = "Bounded screenshot-driven input on the primary logged-in Windows desktop, and Jev as its pilot."
requires-python = ">=3.10"
dependencies = ["PyAutoGUI==0.9.54", "pillow>=10.0.0", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.prime_agent.skill]
import = "computer_use"
