[project]
name = "ha-skill-jev"
version = "0.1.0"
description = "TypeSafe Jev typed decisions for ha's Python kernel (decide, batch with a confidence threshold)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]
