[workspace]
members = [
    "crates/harness-types",
    "crates/harness-cli",
    "crates/harness-store-sqlite",
    "crates/harness-session",
    "crates/harness-kernel",
    "crates/harness-providers",
    "crates/harness-runtime",
    "crates/harness-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DEVfancybear/harness-agents"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
fs2 = "=0.4.3"
futures-util = "=0.3.34"
proptest = "=1.11.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = { version = "=1.2.2" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "uuid"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
toml = "=1.1.5"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
uuid = { version = "=1.26.1", features = ["serde", "v7"] }
ignore = "=0.4.25"
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "job-object", "process-session", "kill-on-drop"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
