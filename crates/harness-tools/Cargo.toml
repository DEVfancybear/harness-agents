[package]
name = "harness-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
harness-providers = { path = "../harness-providers" }
harness-runtime = { path = "../harness-runtime" }
harness-session = { path = "../harness-session" }
harness-store-sqlite = { path = "../harness-store-sqlite" }
harness-types = { path = "../harness-types" }
# prime-agent's destructive-git guard is written with look-ahead patterns;
# this version is already in Cargo.lock.
fancy-regex = "=0.16.2"
globset.workspace = true
ignore.workspace = true
memchr.workspace = true
notify.workspace = true
process-wrap.workspace = true
regex.workspace = true
regex-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["process", "signal"] }

[dev-dependencies]
# Already in Cargo.lock; the M12 probe unit tests need a disposable root.
tempfile.workspace = true

[lints]
workspace = true
