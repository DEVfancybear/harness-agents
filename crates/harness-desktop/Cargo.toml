[package]
name = "harness-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop the computer tool sees and drives: screen capture and real mouse and keyboard input"

# The Win32 calls (GDI capture, SendInput) need `unsafe`, which the workspace
# forbids. This crate is the one place allowed to make them: `unsafe` is denied
# here too and allowed only in the `win32` module, where every block says why it
# is sound. Everything else matches the workspace's lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[target.'cfg(windows)'.dependencies]
# Already in Cargo.lock (through tokio and others); only the features are new.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
