[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ha"
path = "src/main.rs"

[features]
# T01 measurement switch: builds the TUI against ratatui's `scrolling-regions`
# path so `insert_before` can be compared byte-for-byte against the default path.
# The plan requires the decision to be measured, not assumed; the measurement and
# its verdict are recorded in docs/specs/HA_TUI.vi.md.
#
# The name is deliberately the same as ratatui-core's feature: the extra
# `Backend` trait methods that `scrolling-regions` introduces are gated on that
# crate's feature, so `#[cfg(feature = "scrolling-regions")]` in this crate can
# only be correct if the two are enabled together, which this mapping does.
scrolling-regions = ["ratatui/scrolling-regions"]

[dependencies]
clap.workspace = true
# Pinned in the HA_LAUNCH H03 spike; default features cover raw mode, key events
# and bracketed paste on Windows and Unix.
crossterm = "=0.29.0"
# HA_TUI T01/D1: the inline-viewport TUI. Pinned exactly, with the crossterm 0.29
# backend feature so this crate and the TUI share one crossterm version.
ratatui.workspace = true
# HA_TUI T01/D1: cell width after NFC, so Vietnamese text cannot shift the cursor.
unicode-width.workspace = true
unicode-normalization.workspace = true
harness-types = { path = "../harness-types" }
harness-providers = { path = "../harness-providers" }
harness-session = { path = "../harness-session" }
harness-store-sqlite = { path = "../harness-store-sqlite" }
harness-runtime = { path = "../harness-runtime" }
harness-tools = { path = "../harness-tools" }
harness-memory = { path = "../harness-memory" }
harness-orchestrator = { path = "../harness-orchestrator" }
harness-extensions = { path = "../harness-extensions" }
harness-kernel = { path = "../harness-kernel" }
harness-maintenance = { path = "../harness-maintenance" }
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "macros", "schemars", "transport-child-process", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
# Pinned in the HA_LAUNCH H07 spike: real ConPTY on Windows and a real pty on
# Unix, so the no-arg launch is proven in a terminal instead of a pipe.
portable-pty = "=0.9.0"
sqlx.workspace = true
harness-kernel = { path = "../harness-kernel" }
harness-session = { path = "../harness-session" }
harness-store-sqlite = { path = "../harness-store-sqlite" }
harness-tools = { path = "../harness-tools" }
harness-memory = { path = "../harness-memory" }
harness-orchestrator = { path = "../harness-orchestrator" }
harness-extensions = { path = "../harness-extensions" }
harness-maintenance = { path = "../harness-maintenance" }
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
# P6 fixture executables. They live beside the acceptance target that starts
# them, so `CARGO_BIN_EXE_*` resolves the real compiled binary instead of a
# path guess.
[[bin]]
name = "p6_fixture_plugin"
path = "src/bin/p6_fixture_plugin.rs"

[[bin]]
name = "p6_fixture_mcp_server"
path = "src/bin/p6_fixture_mcp_server.rs"