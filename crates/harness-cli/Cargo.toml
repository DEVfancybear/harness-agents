[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ha"
path = "src/main.rs"

[features]
# T01 measurement switch: builds the TUI against ratatui's `scrolling-regions`
# path so `insert_before` can be compared byte-for-byte against the default path.
# The plan requires the decision to be measured, not assumed; the measurement and
# its verdict are recorded in docs/specs/HA_TUI.vi.md.
#
# The name is deliberately the same as ratatui-core's feature: the extra
# `Backend` trait methods that `scrolling-regions` introduces are gated on that
# crate's feature, so `#[cfg(feature = "scrolling-regions")]` in this crate can
# only be correct if the two are enabled together, which this mapping does.
scrolling-regions = ["ratatui/scrolling-regions"]

[dependencies]
clap.workspace = true
# G06 file mention traversal respects Git ignore rules and is capped by the controller.
ignore = "=0.4.25"
# A pasted screenshot lives in the clipboard as a bitmap, which no terminal sends
# as text; the app reads it itself and turns it into a PNG the model can be shown.
arboard.workspace = true
image.workspace = true
# Already in the tree through the HTTP client; pinned here for the one encoder call.
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
# Pinned in the HA_LAUNCH H03 spike; default features cover raw mode, key events
# and bracketed paste on Windows and Unix.
crossterm = "=0.29.0"
# HA_TUI T01/D1: the inline-viewport TUI. Pinned exactly, with the crossterm 0.29
# backend feature so this crate and the TUI share one crossterm version.
ratatui.workspace = true
# HA_TUI T01/D1: cell width after NFC, so Vietnamese text cannot shift the cursor.
unicode-width.workspace = true
unicode-normalization.workspace = true
harness-types = { path = "../harness-types" }
harness-providers = { path = "../harness-providers" }
harness-session = { path = "../harness-session" }
harness-store-sqlite = { path = "../harness-store-sqlite" }
harness-runtime = { path = "../harness-runtime" }
harness-tools = { path = "../harness-tools" }
harness-memory = { path = "../harness-memory" }
harness-orchestrator = { path = "../harness-orchestrator" }
harness-extensions = { path = "../harness-extensions" }
harness-kernel = { path = "../harness-kernel" }
harness-maintenance = { path = "../harness-maintenance" }
# The web surface (`ha web`). Every one of these is already in Cargo.lock
# because reqwest pulls them in; ADR-N10 D1 is that the surface adds no
# dependency tree, so the versions are pinned to what is already resolved.
hyper = { version = "=1.11.1", features = ["server", "http1"] }
# The schedule evaluator needs a real timezone database: a cron expression in a
# zone with daylight saving cannot be evaluated with a fixed offset. Both are
# already in Cargo.lock through other dependencies.
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
http = "=1.5.0"
# The SSE body is a stream; the workspace already pins this for the provider
# stream, so the web surface reuses it rather than adding tokio-stream.
futures-util.workspace = true
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "macros", "schemars", "transport-child-process", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
# Pinned in the HA_LAUNCH H07 spike: real ConPTY on Windows and a real pty on
# Unix, so the no-arg launch is proven in a terminal instead of a pipe.
portable-pty = "=0.9.0"
# The M2 provider stream is a `Stream`; consuming it incrementally needs the
# same stream combinator the provider crate already uses.
futures-util.workspace = true
sqlx.workspace = true
harness-kernel = { path = "../harness-kernel" }
harness-session = { path = "../harness-session" }
harness-store-sqlite = { path = "../harness-store-sqlite" }
harness-tools = { path = "../harness-tools" }
harness-memory = { path = "../harness-memory" }
harness-orchestrator = { path = "../harness-orchestrator" }
harness-extensions = { path = "../harness-extensions" }
harness-maintenance = { path = "../harness-maintenance" }
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
# P6 fixture executables. They live beside the acceptance target that starts
# them, so `CARGO_BIN_EXE_*` resolves the real compiled binary instead of a
# path guess.
[[bin]]
name = "p6_fixture_plugin"
path = "src/bin/p6_fixture_plugin.rs"

[[bin]]
name = "p6_fixture_mcp_server"
path = "src/bin/p6_fixture_mcp_server.rs"

# M0 test helpers: the dependency-edge checker the milestone gate runs, and the
# child fixture that proves the readiness/failpoint protocol.
[[bin]]
name = "dependency_check"
path = "src/bin/dependency_check.rs"

[[bin]]
name = "m0_fixture_host"
path = "src/bin/m0_fixture_host.rs"

# M11-03 fixture: a real MCP server that declares the SEP-2663 tasks extension,
# so the external-task driver negotiates task handles over the wire rather than
# being handed one by a stub.
[[bin]]
name = "m11_fixture_task_server"
path = "src/bin/m11_fixture_task_server.rs"

# M12 probe fixture: the process a capability probe drives. A capability is
# decided by watching a real process try the thing a boundary is supposed to
# stop, so the fixture ships as a real binary the way the others do.
[[bin]]
name = "m12_probe_child"
path = "src/bin/m12_probe_child.rs"
