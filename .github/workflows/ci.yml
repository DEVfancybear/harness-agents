name: Rust foundation checks

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job timeouts are a hung-job guard, not a target. Measured on run 35683233548
  # (the first run whose gates reached the tests on both OSes): ubuntu side 4.4-7.0
  # minutes per phase, windows side 12.1 (P3), 13.8 (P4), 15.2 (P5), 15.7 (P6) and
  # 16.7 (P7). P0's old 10-minute limit cancelled a windows gate that was still
  # running, so every limit below is roughly twice its measured worst case.
  verify-p0:
    name: P0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P0 gate without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P0

  verify-p3:
    name: P3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P3 gate without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P3

  verify-p4:
    name: P4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P4 gate and predecessor regressions without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P4

  verify-p5:
    name: P5 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P5 gate, delegation fixtures and predecessor regressions without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P5
  verify-p6:
    name: P6 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P6 gate, extension fixtures and predecessor regressions without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P6
  verify-p7:
    name: P7 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P7 release gate, backup/restore fixtures and every predecessor regression
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P7

  # This project currently targets Windows in CI. Linux jobs can be added when
  # Linux support and its platform-specific M12 probe results are in scope.
  #
  # The timeout is generous because each gate runs the whole workspace test suite
  # as a regression step before its own required tests.
  verify-milestones:
    name: M-gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        milestone: [M0, M1, M2, M3, M4, M5, M6, M7, M8, M9, M10, M11, M12]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      # M9's packaging case asserts against a real release candidate. M10 and
      # M11 rerun that case as part of their M9 prerequisite closure, and each
      # matrix job has its own filesystem, so those gates prepare their own
      # candidate too. `-PublishDryRun` creates the artefact and checksums but
      # publishes nothing; the other milestones do not read it.
      - name: Build the local release candidate for the M9 closure
        if: matrix.milestone == 'M9' || matrix.milestone == 'M10' || matrix.milestone == 'M11'
        shell: pwsh
        run: ./scripts/New-HaRelease.ps1 -Profile Release -PublishDryRun -OutputDirectory target/release-candidate
      - name: Run the ${{ matrix.milestone }} milestone gate
        shell: pwsh
        run: ./scripts/Verify-Milestone.ps1 -Milestone ${{ matrix.milestone }}

  verify-ha-agent:
    name: HA_AGENT CP-E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux support is pending. The Ubuntu job still runs, so a Linux regression is
    # visible in its own log, but it does not fail the workflow until Linux is a
    # supported platform. Windows stays blocking.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Verify M4, M5, M6 and HA_LAUNCH without PTY
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/ha-agent-ci -Force | Out-Null
          $failed = $false
          foreach ($milestone in @('M4', 'M5', 'M6')) {
            & ./scripts/Verify-Milestone.ps1 -Milestone $milestone -Json *>&1 | Tee-Object -FilePath "target/ha-agent-ci/$milestone.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          & ./scripts/Verify-HaLaunch.ps1 -Json *>&1 | Tee-Object -FilePath target/ha-agent-ci/HA_LAUNCH.log
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-agent-gates-${{ matrix.os }}
          path: target/ha-agent-ci/*.log
          if-no-files-found: warn
      - name: Build Linux x64 release bundle
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: cargo build --release -p harness-cli --locked
      - name: Upload Linux x64 binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ha-linux-x64
          path: target/release/ha
          if-no-files-found: error
