name: Rust foundation checks

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'docs/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-p0:
    name: P0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P0 gate without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P0

  verify-p3:
    name: P3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P3 gate without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P3
