name: Rust foundation checks

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'docs/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job timeouts are a hung-job guard, not a target. Measured on run 35683233548
  # (the first run whose gates reached the tests on both OSes): ubuntu side 4.4-7.0
  # minutes per phase, windows side 12.1 (P3), 13.8 (P4), 15.2 (P5), 15.7 (P6) and
  # 16.7 (P7). P0's old 10-minute limit cancelled a windows gate that was still
  # running, so every limit below is roughly twice its measured worst case.
  verify-p0:
    name: P0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P0 gate without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P0

  verify-p3:
    name: P3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P3 gate without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P3

  verify-p4:
    name: P4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P4 gate and predecessor regressions without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P4

  verify-p5:
    name: P5 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P5 gate, delegation fixtures and predecessor regressions without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P5
  verify-p6:
    name: P6 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P6 gate, extension fixtures and predecessor regressions without credentials
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P6
  verify-p7:
    name: P7 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Run P7 release gate, backup/restore fixtures and every predecessor regression
        shell: pwsh
        run: ./scripts/Verify-Phase.ps1 -Phase P7