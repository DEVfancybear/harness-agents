name: Documentation checks

on:
  push:
    paths:
      - '**.md'
      - 'docs/implementation/manifest.json'
      - 'scripts/Verify-Docs.ps1'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/implementation/manifest.json'
      - 'scripts/Verify-Docs.ps1'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-docs:
    name: Docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Validate bilingual documents and checker negative controls
        shell: pwsh
        run: ./scripts/Verify-Docs.ps1 -SelfTest
